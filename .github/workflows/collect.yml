name: Collecte ligne J

# GitHub lance très mal les tâches programmées sur un petit dépôt : quelques
# déclenchements par jour, souvent avec des heures de retard. Le collecteur ne
# compte donc plus dessus. Chaque lancement relève les trains toutes les
# 3 minutes pendant les plages (matin 5 h - 10 h 30, soir 15 h - 23 h, heure de
# Paris, du lundi au vendredi), attend entre deux plages, puis relance lui-même
# le lancement suivant juste avant la limite de 6 h imposée par GitHub : la
# chaîne ne s'arrête jamais. Les déclenchements programmés ci-dessous ne servent
# qu'à la redémarrer si elle venait à s'interrompre.
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Préparer la branche des relevés
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          f=$(find "$PWD" -name collect.py -not -path '*/.git/*' | head -1)
          if [ -z "$f" ]; then echo "collect.py introuvable dans le dépôt"; exit 1; fi
          if git ls-remote --exit-code --heads "$REPO_URL" releves >/dev/null; then
            git clone -q -b releves "$REPO_URL" "$RUNNER_TEMP/store"
          else
            mkdir -p "$RUNNER_TEMP/store" && cd "$RUNNER_TEMP/store"
            git init -q -b releves && git remote add origin "$REPO_URL"
          fi
          cp "$f" "$RUNNER_TEMP/store/collect.py"
      - name: Relever les trains et relancer la suite
        working-directory: ${{ runner.temp }}/store
        env:
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
          VERNOUILLET_REF: ${{ vars.VERNOUILLET_REF }}
          LAZARE_REF: ${{ vars.LAZARE_REF }}
          COLLECT_FROM: "05:30"
          COLLECT_TO: "10:00"
          GH_TOKEN: ${{ github.token }}
          DISPATCH_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches
          REF: ${{ github.ref_name }}
        run: |
          git config user.name "collecteur-ligne-j"
          git config user.email "collecteur@users.noreply.github.com"
          echo "collect.py" > .git/info/exclude
          in_window() {
            local d=$(TZ=Europe/Paris date +%u) h=$((10#$(TZ=Europe/Paris date +%H%M)))
            [ $d -le 5 ] || return 1
            { [ $h -ge 500 ] && [ $h -lt 1030 ]; } || { [ $h -ge 1500 ] && [ $h -lt 2300 ]; }
          }
          save() {
            mkdir -p data && git add data
            git diff --cached --quiet && return 0
            git commit -q -m "Relevé $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git push -q origin releves && return 0
              git pull -q --rebase origin releves || true
              sleep 5
            done
            echo "::warning::Échec de l'envoi sur la branche releves"
          }
          relancer() {
            if curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                 "$DISPATCH_URL" -d "{\"ref\":\"$REF\"}"; then
              echo "Lancement suivant demandé."
            else
              echo "::warning::Impossible de relancer la suite ; un déclenchement programmé prendra le relais."
            fi
          }
          start=$(date +%s)
          while true; do
            if in_window; then
              python collect.py || echo "::warning::Relevé en échec, nouvel essai dans 3 minutes"
              save
            fi
            # Juste avant la limite de 6 h : on passe la main au lancement suivant
            if [ $(( $(date +%s) - start )) -gt 20400 ]; then relancer; exit 0; fi
            sleep 180
          done
